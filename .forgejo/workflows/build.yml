name: Build and Test Intermasq

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Upload binary to Forgejo Packages on success?"
        required: true
        default: false
        type: boolean
      version_tag:
        description: "Version tag for registry (e.g. v1.0-pre1). Defaults to sha-<short> if empty."
        required: false
        default: ""
        type: string
      run_race_tests:
        description: "Run go test with -race (slower, more thorough)?"
        required: true
        default: true
        type: boolean
      run_perf_tests:
        description: "Run perf/stress scenarios (tests/perf.sh)? Adds ~1-2 min; opt-in."
        required: true
        default: false
        type: boolean
      run_e2e_tests:
        description: "Run Playwright E2E (tests/e2e)? Installs chromium; opt-in."
        required: true
        default: false
        type: boolean
      run_fuzz_tests:
        description: "Run Go fuzz targets (each 30s, opt-in)?"
        required: true
        default: false
        type: boolean
      run_compat_matrix:
        description: "Run smoke.sh vs 3 dnsmasq versions built from upstream source (opt-in)?"
        required: true
        default: false
        type: boolean

jobs:
  build-test:
    runs-on: docker
    container:
      image: fedora:44
    env:
      # All external dependencies via Nora where possible
      GOPROXY: "https://nora.panelka.yadr01.internal/go,direct"
      GOSUMDB: "off"
      GOPRIVATE: "git.yadr00.internal/*"
      # NOTE: do NOT set SSL_CERT_FILE / NODE_EXTRA_CA_CERTS to step-ca.crt
      # directly — that overrides the system bundle and breaks public-CA
      # trust (curl to go.dev / npm / etc fails with "unexpected end of file").
      # The 'update-ca-trust' step adds step-ca to the system bundle, after
      # which all tools trust both public CAs AND step-ca transparently.
      # Static test secret — only valid inside the CI job, never reuse in prod
      INTERMASQ_SECRET: "ci-test-secret-32-bytes-pad-XXXXXXXX"

    steps:
      - name: Install git first (minimal fedora image lacks it)
        run: dnf install -y --setopt=install_weak_deps=False git curl

      - name: Trust Local CA
        run: |
          curl -k https://172.20.0.1:9000/roots.pem -o /etc/pki/ca-trust/source/anchors/step-ca.crt
          update-ca-trust
          git config --global http.sslCAInfo /etc/pki/ca-trust/source/anchors/step-ca.crt

      - name: Configure Nora RPM repo (custom packages if needed)
        run: |
          cat > /etc/yum.repos.d/nora.repo << 'EOF'
          [nora-runner]
          name=Nora Runner Dependencies
          baseurl=https://nora.panelka.yadr01.internal/rpm/runner/
          gpgcheck=0
          enabled=1
          priority=1
          sslverify=1
          EOF

      - name: Install remaining system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            bash tar \
            nodejs npm \
            jq \
            dnsmasq \
            gcc

      - name: Install Go toolchain
        run: |
          # Fedora 44 ships Go 1.24; intermasq needs 1.25+. Tarball from go.dev.
          # -f: fail on HTTP errors (don't pipe HTML error page into tar)
          # Download first, then extract, so we get a clear error if URL is wrong.
          curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz -o /tmp/go.tar.gz
          ls -lh /tmp/go.tar.gz
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          /usr/local/go/bin/go version

      - name: Configure npm registry to Nora
        run: npm config set registry https://nora.panelka.yadr01.internal/npm/

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" -o intermasq-ci .

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          FMT_OUT="$(gofmt -l .)"
          if [ -n "$FMT_OUT" ]; then
            echo "::error::Files need gofmt:"
            echo "$FMT_OUT"
            exit 1
          fi

      - name: L1 + L2 — Go tests (unit + integration)
        env:
          RACE_FLAG: ${{ github.event.inputs.run_race_tests == 'true' && '-race' || '' }}
          # -race requires CGO (and gcc). The binary itself is built with
          # CGO_ENABLED=0 for static linking; tests opt back in here.
          CGO_ENABLED: "1"
        run: |
          echo "Running: go test ./... $RACE_FLAG -count=1"
          go test ./... $RACE_FLAG -count=1

      - name: Fuzz parsers (opt-in, time-bounded)
        # Runs the four native Go fuzz targets (fuzz_test.go) for 30s each in
        # real -fuzz mode (not just the f.Add seed corpus that the default L1/L2
        # step already exercises as unit subtests). Crash artefacts Go writes
        # to testdata/fuzz/<FuzzName>/ — these become a regression corpus and
        # MUST be committed (the default `go test` then replays them as units).
        if: success() && github.event.inputs.run_fuzz_tests == 'true'
        env:
          CGO_ENABLED: "1"
        run: |
          # -fuzz requires a SINGLE package (./... expands to multiple pkgs
          # here, e.g. intermask/docs, which makes go test bail with
          # "fuzz testing requires a single package"). Use '.' = the main
          # package where fuzz_test.go lives.
          FUZZ_RC=0
          for target in FuzzParseDhcpHostLine FuzzParseArpContent FuzzParseAliasLine FuzzParseLeasesContent; do
            echo "::group::fuzz $target (30s)"
            echo "-> go test -run='^\$' -fuzz=\"^${target}\$\" -fuzztime=30s ."
            if go test -run='^$' -fuzz="^${target}$" -fuzztime=30s . 2>&1; then
              echo "fuzz $target: PASS (no crash in 30s)"
            else
              rc=$?
              echo "::warning::fuzz $target exited $rc — crash artefact (if any) is in testdata/fuzz/${target}/"
              FUZZ_RC=$rc
            fi
            echo "::endgroup::"
          done
          if [ "$FUZZ_RC" -ne 0 ]; then
            echo "::error::one or more fuzz targets found a crash (rc=$FUZZ_RC); inspect testdata/fuzz/ in the workspace"
            exit $FUZZ_RC
          fi

      - name: Coverage report
        # Separate step (no -race) so instrumentation overhead & race detector
        # don't skew numbers. Prints per-function coverage and the summary
        # percentage to the CI log, and uploads coverage.out as an artifact.
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./... -count=1 -coverprofile coverage.out
          echo "===== Coverage summary ====="
          go tool cover -func coverage.out | tail -n 1
          echo "===== Per-package ====="
          go tool cover -func coverage.out | grep -E '^intermask/' | sort

      - name: Build & install mock plugin (Gap 6)
        # The plugin dir is hardcoded to /etc/intermasq/plugins in main.go
        # (loadPlugins reads it on startup). CI runs as root in the ephemeral
        # container, so we place the fixture there directly — no source change,
        # no new flags. The mock honours the existing PLUGIN_SOCKET contract.
        run: |
          mkdir -p /etc/intermasq/plugins/hello
          cd tests/fixtures/plugins/hello
          go build -o /etc/intermasq/plugins/hello/hello .
          cp manifest.json /etc/intermasq/plugins/hello/manifest.json
          echo "Installed mock plugin:"
          ls -la /etc/intermasq/plugins/hello/

      - name: L3 — smoke tests against running binary
        run: |
          mkdir -p /tmp/conf /tmp/history
          ./intermasq-ci \
            -port 18081 \
            -conf-dir /tmp/conf \
            -db /tmp/users.json \
            -audit-log /tmp/audit.log \
            -history-dir /tmp/history \
            -templates /tmp/templates.json \
            -leases /tmp/leases \
            -arp-file tests/fixtures/arp-sample.txt \
            -init-system=none \
            -ci-mode=true &
          SERVER_PID=$!
          # Wait for server to bind (max 10 sec)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:18081/api/status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Run smoke suite
          set +e
          BASE=http://localhost:18081 CONF_DIR=/tmp/conf ./tests/smoke.sh
          SMOKE_RC=$?
          set -e
          # Capture logs then kill server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          # Smoke.sh exits 0 on clean pass OR all-fails-are-known-bugs.
          if [ "$SMOKE_RC" -ne 0 ]; then
            echo "::error::smoke.sh returned $SMOKE_RC (unexpected failures present)"
            exit 1
          fi

      - name: L3.5 — dnsmasq compat matrix (opt-in)
        # Builds 3 dnsmasq versions (2.80 / 2.86 / 2.90) from upstream source
        # tarballs and runs the full smoke.sh suite against each, pointing
        # intermasq-ci at the freshly-built binary via -dnsmasq-bin. This
        # exercises the version-sensitive paths (writeConfigWithTest →
        # `dnsmasq --test --conf-file=`, parseDhcpRange auto-detect, the
        # 40-config-files.sh "invalid syntax → 400" check = A13 territory)
        # against real dnsmasq binaries spanning 2018→2024.
        #
        # Why build-from-source (not docker-in-docker): the runner itself
        # lives in a fedora:44 container, so nested `docker run` is not
        # available. A single static intermasq-ci + 3 downloaded dnsmasq
        # tarballs (CC-only build, ~10s each) inside the same container is
        # the simplest reliable matrix. The fedora:44 default dnsmasq is
        # already exercised by the default L3 step above; this step adds the
        # *other* version points.
        #
        # Default CI is not affected: opt-in only.
        if: success() && github.event.inputs.run_compat_matrix == 'true'
        run: |
          set +e

          echo "=== dnsmasq version map ==="
          # System default shipped by the fedora:44 base image:
          SHIPPED=$(dnsmasq --version 2>/dev/null | head -n 1 || echo "(unavailable)")
          echo "fedora:44 system dnsmasq: $SHIPPED"
          echo "matrix src-build versions : 2.80 (2018), 2.86 (2021), 2.90 (2024)"
          echo

          # dnsmasq's Makefile needs `make`; the base image only pulls in gcc.
          # NOT suppressed: if this fails we want the reason in the log, not
          # a silent fast-fail of every `make -C` below (Nora repo has
          # priority=1 and can shadow the fedora repo for overlapping pkgs).
          echo "::group::Install dnsmasq build dep (make)"
          if ! command -v make >/dev/null 2>&1; then
            dnf install -y --setopt=install_weak_deps=False make
            MAKE_INSTALL_RC=$?
            if [ "$MAKE_INSTALL_RC" -ne 0 ]; then
              echo "::error::dnf install make failed (rc=$MAKE_INSTALL_RC) — compat-matrix cannot build dnsmasq"
              echo "::endgroup::"
              exit 1
            fi
          else
            echo "make already present: $(command -v make)"
          fi
          make --version | head -n 1
          echo "::endgroup::"

          # dnsmasq ≤2.90 declares iface_enumerate's callback as `int ()`
          # (K&R, untyped) and passes typed function pointers. gcc 13- warned,
          # gcc 14+ (Fedora 44 ships gcc 15) makes -Wincompatible-pointer-types
          # an error by default → every src-build of <2.91 dies in network.c.
          # dnsmasq's Makefile appends COPTS to CFLAGS, so we downgrade that
          # one diagnostic back to a warning. Vanilla behaviour is preserved;
          # only the gcc-14 strictness policy is relaxed for the old sources.
          export COPTS="-Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration"

          COMPAT_TOTAL_RC=0
          for DNSMASQ_VERSION in 2.80 2.86 2.90; do
            echo "::group::dnsmasq ${DNSMASQ_VERSION}"
            TBALL="/tmp/dnsmasq-${DNSMASQ_VERSION}.tar.gz"
            SRC_DIR="/tmp/dnsmasq-${DNSMASQ_VERSION}"
            # Upstream mirror: http://thekelleys.org.uk/dnsmasq/. Public CA,
            # reachable from the container the same way go.dev is.
            echo "-> curl https://thekelleys.org.uk/dnsmasq/dnsmasq-${DNSMASQ_VERSION}.tar.gz"
            if ! curl -fsSL "https://thekelleys.org.uk/dnsmasq/dnsmasq-${DNSMASQ_VERSION}.tar.gz" -o "$TBALL"; then
              echo "::error::dnsmasq ${DNSMASQ_VERSION}: download failed (curl rc=$?)"
              COMPAT_TOTAL_RC=1
              echo "::endgroup::"
              continue
            fi
            ls -lh "$TBALL"
            rm -rf "$SRC_DIR"
            tar -C /tmp -xzf "$TBALL"
            # Top-level Makefile delegates to src/; default target builds
            # src/dnsmasq. COPTS empty — vanilla build. Output inlined (not
            # redirected to a file) so version-specific build errors show up
            # directly in the group, no separate tail step needed. Capture
            # make's exit code explicitly (NOT via `! cmd` which masks $?).
            echo "-> make -C $SRC_DIR -j2 COPTS=\"$COPTS\""
            make -C "$SRC_DIR" -j2
            MAKE_RC=$?
            if [ "$MAKE_RC" -ne 0 ]; then
              echo "::error::dnsmasq ${DNSMASQ_VERSION} build failed (make rc=$MAKE_RC)"
              COMPAT_TOTAL_RC=1
              echo "::endgroup::"
              continue
            fi
            DNSMASQ_BIN_PATH="$SRC_DIR/src/dnsmasq"
            if [ ! -x "$DNSMASQ_BIN_PATH" ]; then
              echo "::error::dnsmasq ${DNSMASQ_VERSION}: build produced no executable at $DNSMASQ_BIN_PATH"
              ls -la "$SRC_DIR/src/" || true
              COMPAT_TOTAL_RC=1
              echo "::endgroup::"
              continue
            fi
            chmod 0755 "$DNSMASQ_BIN_PATH"
            echo "Built: $DNSMASQ_BIN_PATH"
            "$DNSMASQ_BIN_PATH" --version | head -n 2

            # Per-version isolation: distinct port/conf-dir/db so state from
            # one version never leaks into the next. setup_required stays
            # true on the first probe (fresh -db file), so smoke.sh's
            # preflight suite runs POST /api/setup for each iteration.
            PORT=18091
            CONF_DIR_CI="/tmp/compat-conf-${DNSMASQ_VERSION}"
            HIST_DIR_CI="/tmp/compat-history-${DNSMASQ_VERSION}"
            rm -rf "$CONF_DIR_CI" "$HIST_DIR_CI"
            mkdir -p "$CONF_DIR_CI" "$HIST_DIR_CI"
            rm -f "/tmp/compat-users-${DNSMASQ_VERSION}.json"

            ./intermasq-ci \
              -port "$PORT" \
              -conf-dir "$CONF_DIR_CI" \
              -db "/tmp/compat-users-${DNSMASQ_VERSION}.json" \
              -audit-log "/tmp/compat-audit-${DNSMASQ_VERSION}.log" \
              -history-dir "$HIST_DIR_CI" \
              -templates "/tmp/compat-templates-${DNSMASQ_VERSION}.json" \
              -leases "/tmp/compat-leases-${DNSMASQ_VERSION}" \
              -arp-file tests/fixtures/arp-sample.txt \
              -dnsmasq-bin "$DNSMASQ_BIN_PATH" \
              -init-system=none \
              -ci-mode=true &
            SERVER_PID=$!
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:${PORT}/api/status" >/dev/null 2>&1; then break; fi
              sleep 1
            done

            echo "--- smoke vs dnsmasq ${DNSMASQ_VERSION} ---"
            BASE="http://localhost:${PORT}" CONF_DIR="$CONF_DIR_CI" ./tests/smoke.sh
            SMOKE_RC=$?
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
            echo "dnsmasq ${DNSMASQ_VERSION}: smoke rc=$SMOKE_RC"
            if [ "$SMOKE_RC" -ne 0 ]; then
              echo "::error::smoke vs dnsmasq ${DNSMASQ_VERSION}: rc=$SMOKE_RC (unexpected failures — see suite output above)"
              COMPAT_TOTAL_RC=1
            fi
            echo "::endgroup::"
          done

          if [ "$COMPAT_TOTAL_RC" -ne 0 ]; then
            echo "::error::compat-matrix had failures — see per-version ::error:: above"
            exit 1
          fi
          echo "compat-matrix: all 3 dnsmasq versions passed smoke (no unexpected fails)"

      - name: Perf/stress scenarios (Gap 5, opt-in)
        if: success() && github.event.inputs.run_perf_tests == 'true'
        # Separate server instance (own port/conf-dir) so it cannot collide
        # with the smoke run above. perf.sh only HARD-fails on clear functional
        # breaks (server death, all SSE clients dropped, >5% 5xx); throughput
        # and RSS warnings are informational and don't fail the step.
        run: |
          mkdir -p /tmp/perf-conf /tmp/perf-history
          ./intermasq-ci \
            -port 18082 \
            -conf-dir /tmp/perf-conf \
            -db /tmp/perf-users.json \
            -audit-log /tmp/perf-audit.log \
            -history-dir /tmp/perf-history \
            -templates /tmp/perf-templates.json \
            -leases /tmp/perf-leases \
            -arp-file tests/fixtures/arp-sample.txt \
            -init-system=none \
            -ci-mode=true &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:18082/api/status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          set +e
          BASE=http://localhost:18082 CONF_DIR=/tmp/perf-conf SERVER_PID=$SERVER_PID ./tests/perf.sh
          PERF_RC=$?
          set -e
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$PERF_RC" -ne 0 ]; then
            echo "::error::perf.sh returned $PERF_RC (hard failures present)"
            exit 1
          fi

      - name: L4 — Playwright E2E (Gap 2, opt-in)
        if: success() && github.event.inputs.run_e2e_tests == 'true'
        # Separate server instance (own port/conf-dir) so it cannot collide
        # with the smoke (18081) or perf (18082) runs. Own conf-dir also
        # keeps seeded hosts isolated from other suites.
        #
        # NOTE on deps: `npx playwright install --with-deps` only knows apt
        # (Ubuntu/Debian). On this Fedora 44 container it falls back to the
        # ubuntu dep list and dies on `apt-get: command not found`. So we
        # install chromium's shared-lib deps ourselves via dnf and fetch the
        # browser binary WITHOUT --with-deps.
        #
        # Do NOT install full `gtk3` here: it drags in the whole desktop
        # stack (pipewire/polkit/libcamera/openh264...), and openh264 lives
        # on an external codec mirror unreachable from the container. Headless
        # chromium only needs the specific libs below (atk/at-spi2-atk cover
        # the ATK layer without the multimedia tree). install_weak_deps=False
        # keeps recommended packages (and their codec repos) out.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            nss nspr atk at-spi2-atk cups-libs libdrm libxkbcommon \
            libX11 libXcomposite libXdamage libXext libXfixes libXrandr \
            mesa-libgbm pango alsa-lib libxshmfence
          mkdir -p /tmp/e2e-conf /tmp/e2e-history
          # Writable copy of the arp fixture: the sse-live.spec full variant
          # appends an entry mid-test and observes the new 🟢 via the SSE
          # delta (the fixture itself is read-only in the repo).
          cp tests/fixtures/arp-sample.txt /tmp/e2e-arp.txt
          ./intermasq-ci \
            -port 18083 \
            -conf-dir /tmp/e2e-conf \
            -db /tmp/e2e-users.json \
            -audit-log /tmp/e2e-audit.log \
            -history-dir /tmp/e2e-history \
            -templates /tmp/e2e-templates.json \
            -leases /tmp/e2e-leases \
            -arp-file /tmp/e2e-arp.txt \
            -init-system=none \
            -ci-mode=true &
          E2E_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:18083/api/status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # 2nd instance for setup-screen.spec: fresh -db file (rm -f below) →
          # /api/status returns setup_required:true → AuthScreen renders the
          # setup form. E2E_SETUP_BASE_URL points the spec at this instance.
          rm -rf /tmp/e2e-conf-setup
          mkdir -p /tmp/e2e-conf-setup /tmp/e2e-setup-history
          rm -f /tmp/e2e-setup-users.json
          ./intermasq-ci \
            -port 18084 \
            -conf-dir /tmp/e2e-conf-setup \
            -db /tmp/e2e-setup-users.json \
            -audit-log /tmp/e2e-setup-audit.log \
            -history-dir /tmp/e2e-setup-history \
            -templates /tmp/e2e-setup-templates.json \
            -leases /tmp/e2e-setup-leases \
            -arp-file tests/fixtures/arp-sample.txt \
            -init-system=none \
            -ci-mode=true &
          E2E_SETUP_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:18084/api/status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          cd tests/e2e
          npm ci
          npx playwright install chromium
          set +e
          E2E_BASE_URL=http://localhost:18083 CONF_DIR=/tmp/e2e-conf \
            ADMIN_USER=admin ADMIN_PASS=pass1234 \
            E2E_SETUP_BASE_URL=http://localhost:18084 \
            ARP_FILE=/tmp/e2e-arp.txt \
            npx playwright test
          PW_RC=$?
          set -e
          kill $E2E_SETUP_PID 2>/dev/null || true
          wait $E2E_SETUP_PID 2>/dev/null || true
          kill $E2E_PID 2>/dev/null || true
          wait $E2E_PID 2>/dev/null || true
          if [ "$PW_RC" -ne 0 ]; then
            echo "::error::playwright returned $PW_RC"
            exit 1
          fi

      - name: Show binary info
        run: |
          ls -lh intermasq-ci
          sha256sum intermasq-ci | tee intermasq-ci.sha256

      - name: Publish to Forgejo Packages
        if: success() && github.event.inputs.push_to_registry == 'true'
        env:
          VERSION_INPUT: ${{ github.event.inputs.version_tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$VERSION_INPUT" ]; then
            VERSION="sha-${SHA:0:8}"
          else
            VERSION="$VERSION_INPUT"
          fi
          echo "Publishing as version: $VERSION"

          curl -fSR --cacert /etc/pki/ca-trust/source/anchors/step-ca.crt \
               --user "alexrus:${{ secrets.UPLOAD_TOKEN }}" \
               --upload-file ./intermasq-ci \
               "https://git.yadr00.internal/api/packages/AlexRus1234/generic/intermasq/${VERSION}/intermasq-ci"

          curl -fSR --cacert /etc/pki/ca-trust/source/anchors/step-ca.crt \
               --user "alexrus:${{ secrets.UPLOAD_TOKEN }}" \
               --upload-file ./intermasq-ci.sha256 \
               "https://git.yadr00.internal/api/packages/AlexRus1234/generic/intermasq/${VERSION}/intermasq-ci.sha256"

          echo "✅ Published intermasq-ci v${VERSION}"

      - name: Cleanup
        if: always()
        run: rm -f intermasq-ci intermasq-ci.sha256
