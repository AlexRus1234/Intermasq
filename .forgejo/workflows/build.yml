name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        run: |
          curl -sL https://go.dev/dl/go1.25.0.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build Go binary
        run: go build -o intermasq .

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Smoke test
        run: |
          ./intermasq --ci-mode --systemd-scope none --port 0 &
          sleep 2
          kill %1 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: intermasq-linux-amd64
          path: intermasq
