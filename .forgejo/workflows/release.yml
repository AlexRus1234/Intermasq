name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: docker
    container:
      image: node:22-bookworm
    env:
      NODE_EXTRA_CA_CERTS: /tmp/step-ca.crt
      SSL_CERT_FILE: /tmp/step-ca.crt
    steps:
      - name: Trust Local CA & Configure Git
        run: |
          curl -k https://172.20.0.1:9000/roots.pem -o /tmp/step-ca.crt
          git config --global http.sslCAInfo /tmp/step-ca.crt

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        env:
          GOPRIVATE: "git.yadr00.internal/*"
          GONOSUMDB: "git.yadr00.internal/*"
          GOPROXY: "http://172.20.5.17:10001,direct"
          GOSUMDB: "off"
        run: |
          curl -sL https://go.dev/dl/go1.25.0.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build Go binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ inputs.version }}" -o intermasq .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Generate checksum
        run: sha256sum intermasq > intermasq.sha256

      - name: Upload to Forgejo Packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -fSR --cacert /tmp/step-ca.crt \
               --user "alexrus:${{ secrets.UPLOAD_TOKEN }}" \
               --upload-file ./intermasq \
               "https://git.yadr00.internal/api/packages/AlexRus1234/generic/intermasq/v${VERSION}/intermasq"

          curl -fSR --cacert /tmp/step-ca.crt \
               --user "alexrus:${{ secrets.UPLOAD_TOKEN }}" \
               --upload-file ./intermasq.sha256 \
               "https://git.yadr00.internal/api/packages/AlexRus1234/generic/intermasq/v${VERSION}/intermasq.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: intermasq-${{ inputs.version }}-linux-amd64
          path: |
            intermasq
            intermasq.sha256
