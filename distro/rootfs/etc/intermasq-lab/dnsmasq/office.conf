interface=eth0
listen-address=10.10.1.1
bind-interfaces
port=53
no-resolv
no-hosts
domain=office.test
expand-hosts
dhcp-authoritative
dhcp-range=10.10.1.100,10.10.1.199,255.255.255.0,12h
dhcp-leasefile=/var/lib/intermasq-lab/office/data/dnsmasq.leases
address=/router.office.test/10.10.1.1
conf-file=/etc/intermasq-lab/devices/office.conf
